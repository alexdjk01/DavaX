<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smart Librarian – Retro Chat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="crt">
    <header>SMART LIBRARIAN ⌁ final version</header>
    <div id="messages" class="panel"></div>
    <form id="chat-form">
      <input id="msg" type="text" placeholder="> write here…" autocomplete="off" />
      <button type="submit">SEND</button>
      <button id="mic" type="button" title="Voice input (STT)">REC</button>
    </form>
    <label class="crt-toggle">
      <input id="toggle-tts" type="checkbox" />
      Auto read answers
    </label>
    <div id="extras" class="extras-bar">
      <!-- cover button will be put here dynamically after each answer -->
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
