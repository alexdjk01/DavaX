<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Math Microservice Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Math Microservice Dashboard</h1>

  <section>
    <h2>POW Operation</h2>
    <input type="number" id="base" placeholder="Base" />
    <input type="number" id="exponent" placeholder="Exponent" />
    <button type="button" onclick="computePow()">Compute</button>
    <pre id="powResult"></pre>
  </section>

  <section>
    <h2>Factorial Operation</h2>
    <input type="number" id="factorialInput" placeholder="Number" />
    <button type="button" onclick="computeFactorial() ">Compute</button>
    <pre id="factorialResult"></pre>
  </section>

  <section>
    <h2>Fibonacci Operation</h2>
    <input type="number" id="fibonacciInput" placeholder="Number" />
    <button type="button" onclick="computeFibonacci()">Compute</button>
    <pre id="fibonacciResult"></pre>
  </section>

  <script src="script.js"></script>
</body>
</html>
